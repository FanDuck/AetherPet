<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes dashFlow {
        to { stroke-dashoffset: -28; }
      }
      .flow-line { animation: dashFlow 1.2s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#panelBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Title -->
  <text x="40" y="44" class="font-sans" fill="#7dd3fc" font-size="16" font-weight="700">
    ⚡ 大肥鱼全栈工作流：手势交互 × 多模型流式协议 × WebAudio 频谱口型同步
  </text>

  <!-- Step 1: Mouse & Voice Input -->
  <g class="font-sans" transform="translate(36, 72)">
    <rect width="245" height="210" rx="18" fill="#111c33" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="20" y="34" fill="#38bdf8" font-size="15" font-weight="700">1. 多维感知输入</text>
    <text x="20" y="66" fill="#e2e8f0" font-size="13">🖱️ 左键按住：拎起肥鱼晃悠</text>
    <text x="20" y="94" fill="#e2e8f0" font-size="13">🍕 右键点击：投喂鱼干/吐泡菜单</text>
    <text x="20" y="122" fill="#e2e8f0" font-size="13">🎡 鼠标滚轮：65%~145% 缩放</text>
    <text x="20" y="150" fill="#e2e8f0" font-size="13">🎤 麦克风 ASR + 文本对话</text>
    <text x="20" y="178" fill="#94a3b8" font-size="12">💻 /api/system 实时 CPU/RAM</text>
  </g>

  <!-- Animated Connector 1 -->
  <line x1="281" y1="177" x2="328" y2="177" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" class="flow-line" />

  <!-- Step 2: Multi-LLM Gateway -->
  <g class="font-sans" transform="translate(328, 72)">
    <rect width="260" height="210" rx="18" fill="#111c33" stroke="#a78bfa" stroke-opacity="0.4" />
    <text x="20" y="34" fill="#a78bfa" font-size="15" font-weight="700">2. /api/chat 多模型网关</text>
    <text x="20" y="66" fill="#e2e8f0" font-size="13">🧠 DeepSeek (V3 / R1)</text>
    <text x="20" y="92" fill="#e2e8f0" font-size="13">🌐 OpenAI / 硅基流动 / 千问</text>
    <text x="20" y="118" fill="#e2e8f0" font-size="13">🦙 Ollama 本地离线大模型</text>
    <rect x="16" y="138" width="228" height="52" rx="10" fill="#090d16" stroke="#4c1d95" />
    <text x="26" y="160" class="font-mono" fill="#f472b6" font-size="11.5">[EMOTION:tsundere|ACTION:bubble]</text>
    <text x="26" y="178" fill="#cbd5e1" font-size="11.5">“哼！给你吐串七彩泡泡解闷吧~”</text>
  </g>

  <!-- Animated Connector 2 -->
  <line x1="588" y1="177" x2="635" y2="177" stroke="#f472b6" stroke-width="3" stroke-dasharray="8 6" class="flow-line" />

  <!-- Step 3: Multi-TTS & Lip Sync -->
  <g class="font-sans" transform="translate(635, 72)">
    <rect width="250" height="210" rx="18" fill="#111c33" stroke="#f472b6" stroke-opacity="0.4" />
    <text x="20" y="34" fill="#f472b6" font-size="15" font-weight="700">3. /api/tts 配音与频谱</text>
    <text x="20" y="66" fill="#e2e8f0" font-size="13">🆓 Edge 神经语音 / WebSpeech</text>
    <text x="20" y="92" fill="#e2e8f0" font-size="13">🎙️ CosyVoice2 / FishAudio</text>
    <text x="20" y="118" fill="#e2e8f0" font-size="13">🔊 OpenAI TTS / ElevenLabs</text>
    <text x="20" y="146" fill="#34d399" font-size="12.5" font-weight="600">📊 AudioContext + AnalyserNode</text>
    <text x="20" y="172" fill="#94a3b8" font-size="12">实时提取 100~3000Hz 人声包络</text>
  </g>

  <!-- Animated Connector 3 -->
  <line x1="885" y1="177" x2="932" y2="177" stroke="#34d399" stroke-width="3" stroke-dasharray="8 6" class="flow-line" />

  <!-- Step 4: 3D Stage & Physics -->
  <g class="font-sans" transform="translate(932, 72)">
    <rect width="232" height="210" rx="18" fill="#111c33" stroke="#34d399" stroke-opacity="0.4" />
    <text x="20" y="34" fill="#34d399" font-size="15" font-weight="700">4. Three.js 3D 舞台响应</text>
    <text x="20" y="66" fill="#e2e8f0" font-size="13">👄 嘴巴与 VRM aa 实时张合</text>
    <text x="20" y="94" fill="#e2e8f0" font-size="13">🫧 3D 泡泡 / 全息魔方 / 小鱼干</text>
    <text x="20" y="122" fill="#e2e8f0" font-size="13">🍮 胡克定律果冻挤压回弹</text>
    <text x="20" y="150" fill="#e2e8f0" font-size="13">👀 眼神与头部实时跟随鼠标</text>
    <text x="20" y="178" fill="#7dd3fc" font-size="12">🐾 自由溜达散步 + 声波光环</text>
  </g>
</svg>
